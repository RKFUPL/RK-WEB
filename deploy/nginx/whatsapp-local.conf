# Run from the repository root: nginx -p "$PWD/" -c deploy/nginx/whatsapp-local.conf
# Local fixture only; never replace the VPS's complete nginx.conf with this.
pid /tmp/rk-whatsapp-nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 127.0.0.1:8088;
        server_name localhost;
        include deploy/nginx/whatsapp-location.conf;
        location / { return 404; }
    }
}
