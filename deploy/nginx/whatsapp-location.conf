# Include inside the existing HTTPS server block. Exact match leaves all other
# website locations intact. No URI suffix: preserve /api/webhooks/whatsapp.
location = /api/webhooks/whatsapp {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_pass_request_body on;
    client_max_body_size 1m;
    proxy_cache off;
    # GET verification puts a secret in the query string.
    access_log off;
}
