name: Deploy RK-WEB

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rk-web-production
  cancel-in-progress: false

jobs:
  deploy:
    # Explicit manual runs retain all safeguards; [skip deploy] blocks automatic pushes.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /opt/apps/rashi-kapoor/rk-web

            # Installed/reviewed once by the VPS administrator. Never grant sudo
            # to Python or repository scripts. Fail before changing code/images.
            sudo -n /usr/local/sbin/rk-whatsapp-image-pin-sync --preflight

            # Refuse to replace code/pins beneath an active 30-second worker.
            # Only an authorized operator may pause/audit and later resume it.
            # This guard must run BEFORE git reset installs the repaired override.
            for unit in rk-whatsapp-worker.timer rk-whatsapp-template-refresh.timer; do
              state=$(systemctl show "$unit" --property=ActiveState --value)
              [ "$state" = inactive ] || { echo "WhatsApp timers must be paused and outbox audited before deployment"; exit 1; }
            done
            for unit in rk-whatsapp-worker.service rk-whatsapp-template-refresh.service; do
              state=$(systemctl show "$unit" --property=ActiveState --value)
              case "$state" in inactive|failed) ;; *) echo "WhatsApp services must be quiescent before deployment"; exit 1 ;; esac
            done
            running_names=$(docker ps --format '{{.Names}}')
            if printf '%s\n' "$running_names" | grep -Eq '^rk-whatsapp-(worker|template-refresh)$'; then
              echo "A WhatsApp worker/refresh container is still running"; exit 1
            fi

            echo "==> Fetching latest code"
            git fetch origin main
            git reset --hard origin/main

            python3 scripts/whatsapp_images.py check-paused

            echo "==> Building containers"
            docker compose build

            echo "==> Validating and atomically synchronizing immutable worker image pins"
            # Root writes only the protected pin file and emits two non-secret
            # image references. All repository/Compose validation runs as deploy user.
            umask 077
            pin_file=$(mktemp)
            trap 'rm -f -- "$pin_file"' EXIT
            sudo -n /usr/local/sbin/rk-whatsapp-image-pin-sync --sync > "$pin_file"
            python3 scripts/whatsapp_images.py validate --pins "$pin_file"
            set -a
            . "$pin_file"
            set +a

            release_compose() {
              docker compose -f docker-compose.yml -f deploy/docker-compose.release.yml -f deploy/docker-compose.worker.yml "$@"
            }

            echo "==> Starting containers"
            release_compose up -d --no-build --pull never

            echo "==> Waiting for services"
            sleep 10

            echo "==> Checking containers"
            release_compose ps

            echo "==> Checking RK backend"
            curl -fsS http://127.0.0.1:5000/api/health

            python3 scripts/whatsapp_images.py validate --pins "$pin_file" --require-running
            python3 scripts/whatsapp_images.py check-paused
            sudo -n /usr/local/sbin/rk-whatsapp-image-pin-sync --preflight

            # Do not install/start/restart timers or execute template refresh here.
            # Unit installation and the first execution require the recovery audit.
            echo ""
            echo "==> RK-WEB deployment successful"
