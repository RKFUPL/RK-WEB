services:
  - type: web
    name: rk-web-frontend
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://physihome.shop
      - key: NEXT_PUBLIC_API_URL
        value: https://rk-web-4i13.onrender.com
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: rk-web-api
          property: hostport

  - type: web
    name: rk-web-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_URL
        value: https://physihome.shop
      - key: FRONTEND_URLS
        value: https://rkfupl.onrender.com,https://physihome.shop
